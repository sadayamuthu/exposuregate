[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "exposuregate"
version = "0.1.0"
description = "Gate that grades dependency versions added in lockfiles using OSV and OEBC data."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Karthikeyan Sadayamuthu" }]
requires-python = ">=3.10"
keywords = ["security", "vulnerability", "supply-chain", "kev", "epss", "osv", "lockfile", "pre-commit", "dependencies"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "pyyaml",
    "packaging",
    "tomli; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/sadayamuthu/exposuregate"
Repository = "https://github.com/sadayamuthu/exposuregate"
Issues = "https://github.com/sadayamuthu/exposuregate/issues"
Documentation = "https://github.com/sadayamuthu/exposuregate#readme"
Changelog = "https://github.com/sadayamuthu/exposuregate/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
    "types-PyYAML",
    "jsonschema",
    "build",
    "twine",
]

[project.scripts]
exposuregate = "exposuregate.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["exposuregate"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = "tomli"
ignore_missing_imports = true  # only installed on Python < 3.11

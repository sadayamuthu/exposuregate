name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  version-check:
    name: 🔖 Check Version Not Yet Released
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify the version in pyproject.toml has no tag yet
        run: |
          # Same rule as the release job: a version is released once v<version> is tagged.
          # A PR may keep the version (docs, CI) as long as it is still unreleased.
          git fetch --tags --force origin
          CURRENT_VERSION=$(grep '^version =' pyproject.toml | cut -d '"' -f 2)
          echo "Current Version: $CURRENT_VERSION"
          if git rev-parse -q --verify "refs/tags/v$CURRENT_VERSION" >/dev/null; then
            echo "::error::v$CURRENT_VERSION is already tagged (released)."
            echo "::error::Bump the version in pyproject.toml and src/exposuregate/__init__.py before merging."
            exit 1
          fi
          echo "v$CURRENT_VERSION is not tagged yet; merging will release it."

  quality:
    name: 🔍 Code Quality
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: python -m ruff check .

      - name: Type check (mypy, strict)
        run: python -m mypy src

      - name: Tests with coverage (fails under 90%)
        run: python -m pytest -q --cov=exposuregate --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        if: matrix.python-version == '3.12'
        with:
          files: coverage.xml
        continue-on-error: true

  action:
    name: 🧪 GitHub Action (uses ./)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: uv-direct-kev
            lockfile: uv.lock
            verdict: BLOCK
            exit-code: '1'
          - case: npm-benign
            lockfile: package-lock.json
            verdict: PASS
            exit-code: '0'
    steps:
      - uses: actions/checkout@v7

      - name: Build a repository with a lockfile change
        env:
          CASE: ${{ matrix.case }}
          LOCKFILE: ${{ matrix.lockfile }}
        run: |
          set -euo pipefail
          src="$GITHUB_WORKSPACE/tests/fixtures/planted/cases/$CASE"
          repo="$RUNNER_TEMP/action-repo"
          mkdir -p "$repo" && cd "$repo"
          git init -q -b main
          git config user.name CI
          git config user.email ci@example.invalid
          cp "$src/old/$LOCKFILE" .
          git add . && git commit -qm base
          git checkout -qb change
          cp "$src/new/$LOCKFILE" .
          git add . && git commit -qm change

      - name: Run the action
        id: exposuregate
        uses: ./
        continue-on-error: true
        with:
          working-directory: ${{ runner.temp }}/action-repo
          target-branch: main
          update-data: 'false'
          data-dir: ${{ runner.temp }}/no-data
          args: >-
            --oebc ${{ github.workspace }}/tests/fixtures/planted/data/oebc.json
            --osv-dir ${{ github.workspace }}/tests/fixtures/planted/data/osv
            --as-of 2026-11-13 --max-age-days 200

      - name: Check the outputs
        env:
          VERDICT: ${{ steps.exposuregate.outputs.verdict }}
          EXIT_CODE: ${{ steps.exposuregate.outputs.exit-code }}
          JSON: ${{ steps.exposuregate.outputs.json }}
          WANT_VERDICT: ${{ matrix.verdict }}
          WANT_EXIT: ${{ matrix.exit-code }}
        run: |
          echo "verdict=$VERDICT exit-code=$EXIT_CODE json=$JSON"
          [ "$VERDICT" = "$WANT_VERDICT" ] || { echo "::error::verdict $VERDICT, expected $WANT_VERDICT"; exit 1; }
          [ "$EXIT_CODE" = "$WANT_EXIT" ] || { echo "::error::exit code $EXIT_CODE, expected $WANT_EXIT"; exit 1; }
          [ -f "$JSON" ] || { echo "::error::report.json not found at $JSON"; exit 1; }

  release:
    name: 🚀 Release and Publish
    needs: [quality, action]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # PyPI Trusted Publishing: PyPI trusts this repository, this workflow (ci.yml) and
    # this environment, and swaps the job's OIDC token for a short-lived upload token.
    environment:
      name: pypi
      url: https://pypi.org/project/exposuregate/
    permissions:
      contents: write # Required for creating the tag and the GitHub release
      id-token: write # Required for PyPI Trusted Publishing

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Fetch all history and tags so the tag can be checked

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Extract Project Version
        id: version
        run: |
          VERSION=$(grep '^version =' pyproject.toml | cut -d '"' -f 2)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if the Version Is Already Released
        id: check_tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TAG_NAME="v$VERSION"
          git fetch --tags --force origin
          if ! git rev-parse -q --verify "refs/tags/$TAG_NAME" >/dev/null; then
            echo "Tag $TAG_NAME does not exist. Proceeding."
            echo "release=true" >> "$GITHUB_OUTPUT"
          elif [ "$(git rev-parse "refs/tags/$TAG_NAME^{commit}")" = "$GITHUB_SHA" ]; then
            # A re-run on the tagged commit finishes a release that failed part way;
            # the upload and the release creation below are idempotent.
            echo "Tag $TAG_NAME is this commit. Re-running the release steps."
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "Tag $TAG_NAME already exists on another commit. Skipping release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check That the Package Version Matches __version__
        if: steps.check_tag.outputs.release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          INIT_VERSION=$(grep '^__version__ =' src/exposuregate/__init__.py | cut -d '"' -f 2)
          if [ "$INIT_VERSION" != "$VERSION" ]; then
            echo "::error::pyproject.toml says $VERSION but src/exposuregate/__init__.py says $INIT_VERSION."
            exit 1
          fi

      - name: Install Build Tools
        if: steps.check_tag.outputs.release == 'true'
        run: python -m pip install --upgrade pip build twine

      - name: Build Package
        if: steps.check_tag.outputs.release == 'true'
        run: |
          python -m build
          python -m twine check dist/*

      - name: Create and Push the Tag
        if: steps.check_tag.outputs.release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TAG_NAME="v$VERSION"
          if git rev-parse -q --verify "refs/tags/$TAG_NAME" >/dev/null; then
            echo "Tag $TAG_NAME already exists on this commit."
          else
            git tag "$TAG_NAME" "$GITHUB_SHA"
            git push origin "refs/tags/$TAG_NAME"
          fi

      - name: Publish to PyPI
        if: steps.check_tag.outputs.release == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

      - name: Create the GitHub Release
        if: steps.check_tag.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TAG_NAME="v$VERSION"
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release $TAG_NAME already exists."
            exit 0
          fi
          # Release notes: this version's section of CHANGELOG.md (literal match on the heading).
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on && /^\[[^]]+\]: / { exit }
            on { print }
          ' CHANGELOG.md > release-notes.md
          [ -s release-notes.md ] || echo "Release $TAG_NAME" > release-notes.md
          gh release create "$TAG_NAME" dist/* \
            --title "Release $TAG_NAME" \
            --notes-file release-notes.md \
            --verify-tag
